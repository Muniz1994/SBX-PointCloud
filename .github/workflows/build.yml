name: Build PointCloud GDExtension

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache

jobs:
  # ============================================================
  # build — one job per platform/target/arch combination
  # ============================================================
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ────────────────────────────────────────────
          - name: Linux (debug, x86_64)
            runner: ubuntu-24.04
            platform: linux
            target: template_debug
            arch: x86_64

          - name: Linux (release, x86_64)
            runner: ubuntu-24.04
            platform: linux
            target: template_release
            arch: x86_64

          # ── Windows ──────────────────────────────────────────
          - name: Windows (debug, x86_64)
            runner: windows-2022
            platform: windows
            target: template_debug
            arch: x86_64

          - name: Windows (release, x86_64)
            runner: windows-2022
            platform: windows
            target: template_release
            arch: x86_64

          # ── macOS ────────────────────────────────────────────
          - name: macOS (release, x86_64)
            runner: macos-latest
            platform: macos
            target: template_release
            arch: x86_64

          - name: macOS (release, arm64)
            runner: macos-latest
            platform: macos
            target: template_release
            arch: arm64

          # ── Android ──────────────────────────────────────────
          - name: Android (release, arm64)
            runner: ubuntu-24.04
            platform: android
            target: template_release
            arch: arm64

          # ── Web (Emscripten) ─────────────────────────────────
          - name: Web (release, wasm32)
            runner: ubuntu-24.04
            platform: web
            target: template_release
            arch: wasm32

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: pip install scons

      # ── Platform-specific setup ─────────────────────────────

      - name: (Linux) Install build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: (Android) Install build tools
        if: matrix.platform == 'android'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: (Android) Set up NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: (Android) Set ANDROID_NDK_ROOT
        if: matrix.platform == 'android'
        shell: bash
        run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: (Web) Install build tools
        if: matrix.platform == 'web'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: (Web) Set up Emscripten
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"

      # ── SCons cache ─────────────────────────────────────────

      - name: Cache SCons objects
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-

      # ── Build ────────────────────────────────────────────────

      - name: Build
        shell: bash
        run: |
          # Use all available cores.
          JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
          scons \
            platform=${{ matrix.platform }} \
            target=${{ matrix.target }} \
            arch=${{ matrix.arch }} \
            -j"$JOBS"

      # ── Upload artifact ──────────────────────────────────────

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pointcloud-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}
          path: addons/point_cloud/bin/
          if-no-files-found: error

  # ============================================================
  # package — merge macOS universal, bundle addon, commit to repo
  # ============================================================
  package:
    name: Package All Platforms
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pointcloud-*

      # lipo is available via the llvm package on Ubuntu.
      - name: Install llvm (for lipo)
        run: sudo apt-get update && sudo apt-get install -y llvm

      # Merge the two macOS .framework binaries into a universal fat binary.
      - name: Merge macOS universal binary (release)
        run: |
          FW="libpointcloud.macos.template_release.framework/libpointcloud.macos.template_release"
          X86="artifacts/pointcloud-macos-template_release-x86_64/$FW"
          ARM="artifacts/pointcloud-macos-template_release-arm64/$FW"
          DEST="artifacts/pointcloud-macos-universal/$FW"
          if [ -f "$X86" ] && [ -f "$ARM" ]; then
            mkdir -p "$(dirname "$DEST")"
            llvm-lipo "$X86" "$ARM" -create -output "$DEST"
            echo "macOS universal binary created."
          else
            echo "Warning: one or both macOS arch builds missing, skipping lipo."
          fi

      # Assemble the distributable addon folder.
      - name: Collect addon files
        run: |
          mkdir -p package/addons/point_cloud/bin

          # Static addon assets (scripts, config, extension manifest)
          cp addons/point_cloud/point_cloud.gdextension package/addons/point_cloud/
          cp addons/point_cloud/plugin.cfg               package/addons/point_cloud/
          cp addons/point_cloud/*.gd                     package/addons/point_cloud/

          # Binaries: all non-macOS platforms copied as-is.
          for dir in artifacts/pointcloud-*/; do
            plat=$(basename "$dir" | sed 's/^pointcloud-//' | cut -d- -f1)
            if [ "$plat" != "macos" ]; then
              cp -r "$dir". package/addons/point_cloud/bin/ 2>/dev/null || true
            fi
          done

          # macOS: use the universal binary we built above (if present),
          # otherwise fall back to the arm64 build.
          UNIVERSAL="artifacts/pointcloud-macos-universal"
          ARM64="artifacts/pointcloud-macos-template_release-arm64"
          if [ -d "$UNIVERSAL" ]; then
            cp -r "$UNIVERSAL"/. package/addons/point_cloud/bin/
          elif [ -d "$ARM64" ]; then
            cp -r "$ARM64"/. package/addons/point_cloud/bin/
          fi

      # On push to main branch: commit the freshly built binaries back to the
      # repo so users can install the addon without building from source.
      - name: Commit prebuilt binaries
        if: github.event_name != 'pull_request'
        run: |
          cp -r package/addons/point_cloud/bin/. addons/point_cloud/bin/
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f addons/point_cloud/bin/
          git diff --cached --quiet || \
            git commit -m "ci: update prebuilt binaries [skip ci]"
          git push

      - name: Upload complete addon
        uses: actions/upload-artifact@v4
        with:
          name: point-cloud-addon-all-platforms
          path: package/
          if-no-files-found: error
