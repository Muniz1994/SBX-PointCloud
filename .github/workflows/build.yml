name: Build PointCloud GDExtension

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache

jobs:
  # ============================================================
  # build — one job per platform/target/arch combination
  # ============================================================
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ────────────────────────────────────────────
          - name: Linux (debug, x86_64)
            runner: ubuntu-24.04
            platform: linux
            target: template_debug
            arch: x86_64

          - name: Linux (release, x86_64)
            runner: ubuntu-24.04
            platform: linux
            target: template_release
            arch: x86_64

          # ── Windows ──────────────────────────────────────────
          - name: Windows (debug, x86_64)
            runner: windows-2022
            platform: windows
            target: template_debug
            arch: x86_64

          - name: Windows (release, x86_64)
            runner: windows-2022
            platform: windows
            target: template_release
            arch: x86_64


    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: pip install scons

      # ── Platform-specific setup ─────────────────────────────

      - name: (Linux) Install build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential


      # ── SCons cache ─────────────────────────────────────────

      - name: Cache SCons objects
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-

      # ── Build ────────────────────────────────────────────────

      - name: Build
        shell: bash
        run: |
          # Use all available cores.
          JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
          scons \
            platform=${{ matrix.platform }} \
            target=${{ matrix.target }} \
            arch=${{ matrix.arch }} \
            -j"$JOBS"

      # ── Upload artifact ──────────────────────────────────────

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pointcloud-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}
          path: addons/point_cloud/bin/
          if-no-files-found: error

  # ============================================================
  # package — bundle addon, commit to repo
  # ============================================================
  package:
    name: Package All Platforms
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pointcloud-*

      - name: Collect addon files
        run: |
          mkdir -p package/addons/point_cloud/bin

          # Static addon assets (scripts, config, extension manifest)
          cp addons/point_cloud/point_cloud.gdextension package/addons/point_cloud/
          cp addons/point_cloud/plugin.cfg               package/addons/point_cloud/
          cp addons/point_cloud/*.gd                     package/addons/point_cloud/

          # Binaries: copy all platform artifacts.
          for dir in artifacts/pointcloud-*/; do
            cp -r "$dir". package/addons/point_cloud/bin/ 2>/dev/null || true
          done

      # On push to main branch: commit the freshly built binaries back to the
      # repo so users can install the addon without building from source.
      - name: Commit prebuilt binaries
        if: github.event_name != 'pull_request'
        run: |
          cp -r package/addons/point_cloud/bin/. addons/point_cloud/bin/
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f addons/point_cloud/bin/
          git diff --cached --quiet || \
            git commit -m "ci: update prebuilt binaries [skip ci]"
          git push

      - name: Upload complete addon
        uses: actions/upload-artifact@v4
        with:
          name: point-cloud-addon-all-platforms
          path: package/
          if-no-files-found: error
